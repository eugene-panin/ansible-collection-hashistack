---
- name: Ensure the PKI directory exists on the controller
  ansible.builtin.file:
    path: "{{ consul_pki_dir }}"
    state: directory
    mode: '0700'
  when: not _consul_ca_given | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: Check whether the CA already exists on the controller
  ansible.builtin.stat:
    path: "{{ _consul_ca_key }}"
  register: _consul_ca_stat
  when: not _consul_ca_given | bool
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Generate the CA private key
  community.crypto.openssl_privatekey:
    path: "{{ _consul_ca_key }}"
    type: ECC
    curve: secp256r1
    mode: '0600'
  when:
    - not _consul_ca_given | bool
    - _consul_pki_live | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: Build the CA signing request
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ _consul_ca_key }}"
    common_name: "Consul Agent CA {{ consul_datacenter }}"
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
      - digitalSignature
    key_usage_critical: true
  register: _consul_ca_csr
  when:
    - not _consul_ca_given | bool
    - _consul_pki_live | bool
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false

- name: Generate the CA certificate
  community.crypto.x509_certificate:
    path: "{{ _consul_ca_cert }}"
    privatekey_path: "{{ _consul_ca_key }}"
    csr_content: "{{ _consul_ca_csr.csr }}"
    provider: selfsigned
    selfsigned_not_after: "+{{ consul_pki_ca_days }}d"
    mode: '0644'
  when:
    - not _consul_ca_given | bool
    - _consul_pki_live | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: Read the CA from the controller
  ansible.builtin.slurp:
    src: "{{ item }}"
  register: _consul_ca_files
  loop:
    - "{{ _consul_ca_cert }}"
    - "{{ _consul_ca_key }}"
  when:
    - not _consul_ca_given | bool
    - _consul_ca_stat.stat.exists | default(false) or not ansible_check_mode
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Ensure the TLS directory exists on the node
  ansible.builtin.file:
    path: "{{ consul_tls_dir }}"
    state: directory
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: '0750'

- name: Generate the agent private key on the node
  community.crypto.openssl_privatekey:
    path: "{{ _consul_remote_key }}"
    type: ECC
    curve: secp256r1
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: '0600'
  when: _consul_crypto_live | bool
  notify: "restart consul"

- name: Check whether the agent key is on the node
  ansible.builtin.stat:
    path: "{{ _consul_remote_key }}"
  register: _consul_agent_key_stat
  check_mode: false

- name: Build the agent signing request from the node's key
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ _consul_remote_key }}"
    common_name: "{{ _consul_cert_cn }}"
    subject_alt_name: "{{ _consul_cert_sans }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    key_usage_critical: true
    extended_key_usage:
      - serverAuth
      - clientAuth
  register: _consul_agent_csr
  when: _consul_agent_key_stat.stat.exists
  changed_when: false

- name: Read the certificate the node holds now
  ansible.builtin.slurp:
    src: "{{ _consul_remote_cert }}"
  register: _consul_agent_cert_current
  failed_when: false

- name: Sign the agent certificate on the controller
  community.crypto.x509_certificate_pipe:
    content: "{{ _consul_agent_cert_current.content | default('') | b64decode | default(omit, true) }}"
    csr_content: "{{ _consul_agent_csr.csr }}"
    provider: ownca
    ownca_content: "{{ _consul_ca_cert_pem }}"
    ownca_privatekey_content: "{{ _consul_ca_key_pem }}"
    ownca_not_after: "+{{ consul_pki_cert_days }}d"
  register: _consul_agent_cert
  when:
    - _consul_agent_csr.csr is defined
    - _consul_ca_key_pem | length > 0
  delegate_to: localhost
  become: false
  no_log: true

- name: Install the CA and the signed certificate on the node
  ansible.builtin.copy:
    content: "{{ item.content }}\n"
    dest: "{{ item.dest }}"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: '0640'
  loop:
    - dest: "{{ _consul_remote_ca }}"
      content: "{{ _consul_ca_cert_pem | trim }}"
    - dest: "{{ _consul_remote_cert }}"
      content: "{{ _consul_agent_cert.certificate | default('') | trim }}"
  loop_control:
    label: "{{ item.dest }}"
  when: item.content | length > 0
  notify: "restart consul"

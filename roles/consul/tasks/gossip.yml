---
- name: Check whether a generated gossip key already exists
  ansible.builtin.stat:
    path: "{{ _consul_gossip_key_path }}"
  register: _consul_gossip_stat
  when: _consul_gossip_generated | bool
  check_mode: false

- name: Generate a gossip key for a datacenter that was not given one
  ansible.builtin.shell:
    cmd: >-
      umask 077
      && {{ consul_bin_dir }}/consul keygen > {{ _consul_gossip_key_path | quote }}.new
      && mv {{ _consul_gossip_key_path | quote }}.new {{ _consul_gossip_key_path | quote }}
    creates: "{{ _consul_gossip_key_path }}"
  when:
    - _consul_gossip_generated | bool
    - _consul_primary | bool
    - _consul_live | bool

- name: Read the generated gossip key
  ansible.builtin.slurp:
    src: "{{ _consul_gossip_key_path }}"
  register: _consul_gossip_slurp
  when:
    - _consul_gossip_generated | bool
    - _consul_primary | bool
    - _consul_gossip_stat.stat.exists | default(false) or not ansible_check_mode
  no_log: true

- name: Share the generated gossip key with the rest of the datacenter
  ansible.builtin.set_fact:
    _consul_gossip_shared: "{{ _consul_gossip_slurp.content | b64decode | trim }}"
  when: _consul_gossip_slurp.content is defined
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    label: "{{ item }}"
  no_log: true

- name: Keep the generated gossip key on every node
  ansible.builtin.copy:
    content: "{{ _consul_gossip_shared }}\n"
    dest: "{{ _consul_gossip_key_path }}"
    owner: "{{ consul_user }}"
    group: "{{ consul_group }}"
    mode: '0600'
  when:
    - _consul_gossip_generated | bool
    - _consul_gossip_shared | default('') | length > 0
  no_log: true

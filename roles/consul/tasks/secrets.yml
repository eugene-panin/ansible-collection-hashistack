---
- name: Ensure the token directory exists on the controller
  ansible.builtin.file:
    path: "{{ _consul_token_dir }}"
    state: directory
    mode: '0700'
  when: not _consul_tokens_given | bool
  delegate_to: localhost
  become: false
  run_once: true

- name: Mint the bootstrap token once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) | to_uuid }}\n"
    dest: "{{ _consul_bootstrap_token_path }}"
    mode: '0600'
    force: false
  when: consul_acl_bootstrap_token | length == 0
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Check whether the bootstrap token is on the controller
  ansible.builtin.stat:
    path: "{{ _consul_bootstrap_token_path }}"
  register: _consul_bootstrap_stat
  when: consul_acl_bootstrap_token | length == 0
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Read the bootstrap token
  ansible.builtin.slurp:
    src: "{{ _consul_bootstrap_token_path }}"
  register: _consul_bootstrap_slurp
  when:
    - consul_acl_bootstrap_token | length == 0
    - _consul_bootstrap_stat.stat.exists
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Mint an agent token for this node once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) | to_uuid }}\n"
    dest: "{{ _consul_agent_token_path }}"
    mode: '0600'
    force: false
  when: consul_acl_agent_token | length == 0
  delegate_to: localhost
  become: false
  no_log: true

- name: Check whether this node's agent token is on the controller
  ansible.builtin.stat:
    path: "{{ _consul_agent_token_path }}"
  register: _consul_agent_token_stat
  when: consul_acl_agent_token | length == 0
  delegate_to: localhost
  become: false
  check_mode: false

- name: Read this node's agent token
  ansible.builtin.slurp:
    src: "{{ _consul_agent_token_path }}"
  register: _consul_agent_token_slurp
  when:
    - consul_acl_agent_token | length == 0
    - _consul_agent_token_stat.stat.exists
  delegate_to: localhost
  become: false
  no_log: true

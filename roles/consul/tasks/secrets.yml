---
- name: Ensure the token directory exists on the controller
  ansible.builtin.file:
    path: "{{ _consul_token_dir }}"
    state: directory
    mode: '0700'
  delegate_to: localhost
  become: false
  run_once: true

- name: Mint the bootstrap token once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) | to_uuid }}\n"
    dest: "{{ _consul_bootstrap_token_path }}"
    mode: '0600'
    force: false
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Mint an agent token for this node once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) | to_uuid }}\n"
    dest: "{{ _consul_agent_token_path }}"
    mode: '0600'
    force: false
  delegate_to: localhost
  become: false
  no_log: true

- name: Check which tokens are on the controller
  ansible.builtin.stat:
    path: "{{ item }}"
  register: _consul_token_stat
  loop:
    - "{{ _consul_bootstrap_token_path }}"
    - "{{ _consul_agent_token_path }}"
  delegate_to: localhost
  become: false
  check_mode: false

- name: Read the bootstrap token
  ansible.builtin.slurp:
    src: "{{ _consul_bootstrap_token_path }}"
  register: _consul_bootstrap_slurp
  when: _consul_token_stat.results[0].stat.exists
  delegate_to: localhost
  become: false
  no_log: true

- name: Read this node's agent token
  ansible.builtin.slurp:
    src: "{{ _consul_agent_token_path }}"
  register: _consul_agent_token_slurp
  when: _consul_token_stat.results[1].stat.exists
  delegate_to: localhost
  become: false
  no_log: true

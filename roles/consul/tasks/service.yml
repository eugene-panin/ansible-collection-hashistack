---
- name: Ensure consul is enabled and running
  ansible.builtin.systemd_service:
    name: consul
    enabled: true
    state: started
    daemon_reload: true
  when: _consul_live | bool

- name: Wait until the cluster has a leader
  ansible.builtin.uri:
    url: "{{ _consul_api_addr }}/v1/status/leader"
    validate_certs: false
    return_content: true
  register: _consul_ready
  until: _consul_ready.content | default('') | length > 2
  retries: 60
  delay: 2
  when: _consul_live | bool
  changed_when: false
  check_mode: false

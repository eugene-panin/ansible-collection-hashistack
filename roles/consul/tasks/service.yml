---
- name: Ensure consul is enabled and running
  ansible.builtin.systemd_service:
    name: consul
    enabled: true
    state: started
    daemon_reload: true
  when: _consul_live | bool

- name: Wait for the agent to answer
  ansible.builtin.uri:
    url: "{{ _consul_api_addr }}/v1/status/leader"
    validate_certs: false
    status_code: [200, 403]
  register: _consul_ready
  until: _consul_ready is succeeded
  retries: 30
  delay: 2
  when: _consul_live | bool
  changed_when: false
  check_mode: false

---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Look for anything the role wrote to the controller
      ansible.builtin.find:
        paths: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}"
        patterns:
          - "*.token"
          - "*.pem"
        recurse: true
      register: _consul_rotation_controller_files
      delegate_to: localhost
      become: false

    - name: Assert secrets given as values never touched the controller's disk
      ansible.builtin.assert:
        that:
          - _consul_rotation_controller_files.files | map(attribute='path') | map('basename') | sort == ['ca-key.pem', 'ca.pem']
        quiet: true

    - name: Read the keyring after the rotation
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/operator/keyring
        validate_certs: false
        headers:
          X-Consul-Token: "{{ consul_acl_bootstrap_token }}"
        return_content: true
      register: _consul_rotation_done

    - name: Assert only the new key is left, and it is primary
      ansible.builtin.assert:
        that:
          - _consul_rotation_done.json | map(attribute='Keys') | map('list') | unique | list
            == [['QUtMNOaDxsZL0l5pnG3vXXpdEUJUATl6sEQlFPdNcvI=']]
          - _consul_rotation_done.json | map(attribute='PrimaryKeys') | map('list') | unique | list
            == [['QUtMNOaDxsZL0l5pnG3vXXpdEUJUATl6sEQlFPdNcvI=']]
        quiet: true

    - name: Look the tokens up by their secrets, old and new
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/acl/token/self
        validate_certs: false
        headers:
          X-Consul-Token: "{{ item }}"
        status_code: [200, 403]
      loop:
        - 7a1b2c3d-4e5f-4a6b-9c7d-8e9f0a1b2c3d
        - 0f1e2d3c-4b5a-4968-8776-655443322110
        - 2c9d8e7f-6a5b-4c3d-8e1f-a0b9c8d7e6f5
        - 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b
      register: _consul_rotation_tokens

    - name: Assert the new tokens work and the old ones are gone
      ansible.builtin.assert:
        that:
          - _consul_rotation_tokens.results | map(attribute='status') | list == [200, 200, 403, 403]
        quiet: true

    - name: Restart the agent
      ansible.builtin.systemd_service:
        name: consul
        state: restarted

    - name: Wait for a leader after the restart
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/status/leader
        validate_certs: false
        return_content: true
      register: _consul_rotation_leader
      until: _consul_rotation_leader.content | default('') | length > 2
      retries: 30
      delay: 2

    - name: Read the keyring after the restart
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/operator/keyring
        validate_certs: false
        headers:
          X-Consul-Token: "{{ consul_acl_bootstrap_token }}"
        return_content: true
      register: _consul_rotation_restarted

    - name: Assert the rotation survived the restart
      ansible.builtin.assert:
        that:
          - _consul_rotation_restarted.json | map(attribute='Keys') | map('list') | unique | list
            == [['QUtMNOaDxsZL0l5pnG3vXXpdEUJUATl6sEQlFPdNcvI=']]
        quiet: true

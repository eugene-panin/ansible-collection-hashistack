---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  vars:
    consul_acl_token_path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/tokens/bootstrap.token"
  tasks:
    - name: Read the bootstrap token
      ansible.builtin.slurp:
        src: "{{ consul_acl_token_path }}"
      register: _consul_verify_token
      delegate_to: localhost
      become: false
      no_log: true

    - name: Ask the running agent which version it is
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/agent/self
        validate_certs: false
        headers:
          X-Consul-Token: "{{ _consul_verify_token.content | b64decode | trim }}"
        return_content: true
      register: _consul_verify_self
      no_log: true

    - name: Assert the upgrade restarted the agent onto the new binary
      ansible.builtin.assert:
        that:
          - _consul_verify_self.json.Config.Version == '1.20.2'
        quiet: true

    - name: List what the role keeps in the PKI directory on the controller
      ansible.builtin.find:
        paths: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/pki"
      register: _consul_verify_pki_files
      delegate_to: localhost
      become: false

    - name: Assert the controller holds the CA and no agent key
      ansible.builtin.assert:
        that:
          - _consul_verify_pki_files.files | map(attribute='path') | map('basename') | sort
            == ['consul-agent-ca-key.pem', 'consul-agent-ca.pem']
        quiet: true

    - name: List what the agent will load as configuration
      ansible.builtin.find:
        paths: /etc/consul.d
        patterns:
          - "*.hcl"
          - "*.json"
      register: _consul_verify_config_files

    - name: Assert nothing but the agent config sits in the config directory
      ansible.builtin.assert:
        that:
          - _consul_verify_config_files.files | map(attribute='path') | list == ['/etc/consul.d/consul.json']
        quiet: true

    - name: Mark the time of the restart
      ansible.builtin.command:
        argv:
          - date
          - +%s
      register: _consul_verify_restart_at
      changed_when: false

    - name: Restart the agent, as a reboot would
      ansible.builtin.systemd_service:
        name: consul
        state: restarted

    - name: Wait for the agent to come back with a leader
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/status/leader
        validate_certs: false
        return_content: true
      register: _consul_verify_after_restart
      until: _consul_verify_after_restart.content | default('') | length > 2
      retries: 30
      delay: 2

    - name: Ask the agent who the leader is
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/status/leader
        validate_certs: false
        return_content: true
      register: _consul_verify_leader

    - name: Assert a leader was elected over TLS
      ansible.builtin.assert:
        that:
          - _consul_verify_leader.content | length > 2
        quiet: true

    - name: Assert the plain HTTP port is not listening
      ansible.builtin.wait_for:
        port: 8500
        host: 127.0.0.1
        state: stopped
        timeout: 5

    - name: Read this node from the catalog with the bootstrap token
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/catalog/nodes
        validate_certs: false
        headers:
          X-Consul-Token: "{{ _consul_verify_token.content | b64decode | trim }}"
        return_content: true
      register: _consul_verify_nodes
      no_log: true

    - name: Assert the node registered itself
      ansible.builtin.assert:
        that:
          - _consul_verify_nodes.json | length == 1
        quiet: true

    - name: Read the catalog without a token
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/catalog/nodes
        validate_certs: false
        return_content: true
      register: _consul_verify_anonymous

    - name: Assert an anonymous reader sees nothing
      ansible.builtin.assert:
        that:
          - _consul_verify_anonymous.json | length == 0
        quiet: true

    - name: Assert gossip encryption is on
      ansible.builtin.command:
        argv:
          - /usr/local/bin/consul
          - keyring
          - -list
      environment:
        CONSUL_HTTP_ADDR: https://127.0.0.1:8501
        CONSUL_HTTP_SSL_VERIFY: "false"
        CONSUL_HTTP_TOKEN: "{{ _consul_verify_token.content | b64decode | trim }}"
      register: _consul_verify_keyring
      changed_when: false
      no_log: true

    - name: Assert the keyring holds a key
      ansible.builtin.assert:
        that:
          - _consul_verify_keyring.rc == 0
        quiet: true

    - name: Read this node's agent token from the controller
      ansible.builtin.slurp:
        src: "{{ consul_acl_token_path | dirname }}/dc1-instance-consul-agent.token"
      register: _consul_verify_agent_token
      delegate_to: localhost
      become: false
      no_log: true

    - name: Look the agent token up as itself
      ansible.builtin.uri:
        url: https://127.0.0.1:8501/v1/acl/token/self
        validate_certs: false
        headers:
          X-Consul-Token: "{{ _consul_verify_agent_token.content | b64decode | trim }}"
        return_content: true
      register: _consul_verify_agent_self
      no_log: true

    - name: Assert the agent token carries this node's identity and nothing more
      ansible.builtin.assert:
        that:
          - _consul_verify_agent_self.json.NodeIdentities | map(attribute='NodeName') | list == ['instance-consul']
          - _consul_verify_agent_self.json.Policies | default([]) | length == 0
        quiet: true

    - name: Read the agent log since the restart
      ansible.builtin.command:
        argv:
          - journalctl
          - -u
          - consul
          - --no-pager
          - --since
          - "@{{ _consul_verify_restart_at.stdout }}"
      register: _consul_verify_log
      changed_when: false

    - name: Assert the agent is not being refused by ACLs
      ansible.builtin.assert:
        that:
          - "'blocked by ACLs' not in _consul_verify_log.stdout"
        quiet: true

---
_consul_role: "{{ 'server' if consul_server | bool else 'client' }}"
_consul_cert_cn: "{{ _consul_role }}.{{ consul_datacenter }}.consul"

_consul_live: "{{ not (ansible_check_mode and not _consul_binary_stat.stat.exists | default(false)) }}"
_consul_api_scheme: "{{ 'https' if consul_tls | bool else 'http' }}"
_consul_api_port: "{{ 8501 if consul_tls | bool else 8500 }}"
_consul_api_addr: "{{ _consul_api_scheme }}://127.0.0.1:{{ _consul_api_port }}"
_consul_api_ca: "{{ _consul_remote_ca if consul_tls | bool else omit }}"

_consul_primary: "{{ inventory_hostname == ansible_play_hosts | first }}"

_consul_token_dir: "{{ consul_acl_token_path | dirname }}"
_consul_bootstrap_token_path: "{{ consul_acl_token_path }}"
_consul_agent_token_path: "{{ _consul_token_dir }}/{{ consul_datacenter }}-{{ consul_node_name }}-agent.token"
_consul_agent_accessor: "{{ (consul_datacenter ~ '/' ~ consul_node_name) | to_uuid }}"

_consul_management_token: >-
  {{ consul_acl_bootstrap_token if consul_acl_bootstrap_token | length > 0
     else _consul_bootstrap_slurp.content | default('') | b64decode | trim }}
_consul_agent_token: >-
  {{ consul_acl_agent_token if consul_acl_agent_token | length > 0
     else _consul_agent_token_slurp.content | default('') | b64decode | trim }}
_consul_tokens_given: "{{ consul_acl_bootstrap_token | length > 0 and consul_acl_agent_token | length > 0 }}"

_consul_gossip_generated: "{{ consul_gossip_keys | length == 0 }}"
_consul_gossip_keys_effective: >-
  {{ consul_gossip_keys if consul_gossip_keys | length > 0
     else ([_consul_gossip_shared] if _consul_gossip_shared | default('') | length > 0 else []) }}
_consul_gossip_value: "{{ _consul_gossip_keys_effective | first | default('') }}"

_consul_cert_sans: >-
  {{ ['DNS:' ~ _consul_cert_cn, 'DNS:localhost', 'IP:127.0.0.1']
     + ['IP:' ~ consul_bind_address] }}

_consul_remote_ca: "{{ consul_tls_dir }}/ca.pem"
_consul_remote_cert: "{{ consul_tls_dir }}/agent.pem"
_consul_remote_key: "{{ consul_tls_dir }}/agent-key.pem"

_consul_gossip_key_path: "{{ consul_config_dir }}/gossip.key"

_consul_base_config:
  datacenter: "{{ consul_datacenter }}"
  node_name: "{{ consul_node_name }}"
  data_dir: "{{ consul_data_dir }}"
  bind_addr: "{{ consul_bind_address }}"
  advertise_addr: "{{ consul_advertise_address }}"
  client_addr: "{{ consul_client_address }}"
  server: "{{ consul_server | bool }}"
  log_level: "{{ consul_log_level }}"
  retry_join: "{{ consul_retry_join }}"
  ui_config:
    enabled: "{{ consul_ui | bool }}"

_consul_server_config:
  bootstrap_expect: "{{ consul_bootstrap_expect | int }}"

_consul_acl_config:
  acl:
    enabled: true
    default_policy: "{{ consul_acl_default_policy }}"
    down_policy: extend-cache
    enable_token_persistence: false

_consul_acl_agent_token_config:
  acl:
    tokens:
      agent: "{{ _consul_agent_token }}"

_consul_tls_config:
  tls:
    defaults:
      ca_file: "{{ _consul_remote_ca }}"
      cert_file: "{{ _consul_remote_cert }}"
      key_file: "{{ _consul_remote_key }}"
      verify_incoming: false
      verify_outgoing: true
    internal_rpc:
      verify_incoming: true
      verify_server_hostname: true
  ports:
    http: -1
    https: 8501

_consul_config: >-
  {{ _consul_base_config
     | combine(_consul_server_config if consul_server | bool else {})
     | combine(_consul_acl_config if consul_acl | bool else {})
     | combine(_consul_acl_agent_token_config
               if consul_acl | bool and _consul_agent_token | length > 0 else {}, recursive=True)
     | combine(_consul_tls_config if consul_tls | bool else {})
     | combine({'encrypt': _consul_gossip_value} if _consul_gossip_value | length > 0 else {})
     | combine(consul_extra_config, recursive=True) }}

---
argument_specs:
  main:
    short_description: Run a Consul agent
    description:
      - Installs Consul, generates the agent's private key on the node, has
        the controller sign it with the CA, settles the gossip keyring,
        renders the agent configuration and manages the systemd unit. The
        agent's private key never leaves the node.
      - Every secret can be given as a value, from whatever store the
        inventory reads. Anything not given is minted once and kept in files
        on the controller.
      - With ACLs on, the bootstrap token and one agent token per node are
        minted on the controller as UUIDs before Consul sees them. The ACL
        system is bootstrapped with that secret, and each agent token is
        created with that node's built-in node identity and written into the
        agent's configuration.
    options:
      consul_version:
        type: str
        default: 1.20.2
        description: Exact version to install.
      consul_datacenter:
        type: str
        default: dc1
        description: Datacenter name, also part of the certificate names.
      consul_server:
        type: bool
        default: false
        description: Run as a server rather than a client.
      consul_bootstrap_expect:
        type: int
        default: 1
        description:
          - Servers required before the cluster elects a leader.
          - Ignored on clients. Use an odd number; 1 means a single server with
            no fault tolerance.
      consul_node_name:
        type: str
        default: "{{ inventory_hostname }}"
        description: Node name as it appears in the catalog.
      consul_bind_address:
        type: str
        required: true
        description:
          - Address the agent binds and advertises on.
          - There is no sane default. Binding to a private or tunnel address is
            what keeps the cluster off the public internet.
      consul_advertise_address:
        type: str
        description: Advertised address, when it differs from the bind address.
      consul_client_address:
        type: str
        description: Addresses the HTTP and DNS interfaces listen on.
      consul_retry_join:
        type: list
        elements: str
        default: []
        description: Addresses of other agents to join. Empty on a single node.
      consul_ui:
        type: bool
        description: Serve the web UI. Defaults to on for servers.
      consul_log_level:
        type: str
        default: INFO
        description: Agent log level.
      consul_bin_dir:
        type: str
        default: /usr/local/bin
        description: Where the binary is installed.
      consul_user:
        type: str
        default: consul
        description: System user the agent runs as.
      consul_group:
        type: str
        default: consul
        description: Group the agent runs as.
      consul_data_dir:
        type: str
        default: /opt/consul
        description: Agent data directory.
      consul_config_dir:
        type: str
        default: /etc/consul.d
        description: Agent configuration directory.
      consul_gossip_encryption:
        type: bool
        default: true
        description: Encrypt the gossip protocol.
      consul_gossip_keys:
        type: list
        elements: str
        default: []
        description:
          - Gossip keys the keyring is converged to. The first is the primary;
            any key the cluster holds that is not listed is removed.
          - Rotate by declaring C([new, old]) for one run and C([new]) for the
            next.
          - Left empty, the first host in the play generates a key once and
            shares it. Fine for a first deployment; declare the keys, from a
            vault, before you ever need to rotate.
      consul_tls:
        type: bool
        default: true
        description: Serve the API over HTTPS and require TLS for internal RPC.
      consul_tls_dir:
        type: str
        description: Where certificates land on the node.
      consul_pki_dir:
        type: str
        default: ""
        description:
          - Directory on the controller where the CA is generated and kept, when
            it is not given through O(consul_pki_ca_cert) and
            O(consul_pki_ca_key).
          - Holds the CA only. Agent keys are generated on the nodes.
      consul_pki_ca_cert:
        type: str
        default: ""
        description:
          - The CA certificate, PEM. Give it together with O(consul_pki_ca_key)
            to keep the CA out of files on the controller.
      consul_pki_ca_key:
        type: str
        default: ""
        description:
          - The CA private key, PEM. Used on the controller to sign agent
            certificates; never copied to a node.
      consul_pki_ca_days:
        type: int
        default: 3650
        description: CA lifetime in days.
      consul_pki_cert_days:
        type: int
        default: 825
        description: Agent certificate lifetime in days.
      consul_acl:
        type: bool
        default: true
        description: Enable the ACL system.
      consul_acl_default_policy:
        type: str
        default: deny
        choices: [deny, allow]
        description: What happens to a request no policy matches.
      consul_acl_bootstrap_token:
        type: str
        default: ""
        description:
          - The bootstrap token, a UUID. The ACL system is bootstrapped with
            it. Left empty, one is minted into O(consul_acl_token_path).
      consul_acl_agent_token:
        type: str
        default: ""
        description:
          - This node's agent token, a UUID. Set per host. Left empty, one is
            minted next to O(consul_acl_token_path).
      consul_acl_token_path:
        type: str
        default: ""
        description:
          - File on the controller holding the bootstrap token when it is not
            given as a value. Needed unless both tokens are given.
          - One agent token per node is kept next to it, named
            C(<datacenter>-<node>-agent.token).
          - All of them are secrets in plain text; keep them where you would
            keep a private key.
      consul_extra_config:
        type: dict
        default: {}
        description:
          - Merged into the generated configuration, recursively, last.
          - The escape hatch for anything this role does not model.

---
consul_version: 1.20.2
consul_datacenter: dc1
consul_server: false
consul_bootstrap_expect: 1
consul_node_name: "{{ inventory_hostname }}"

consul_bind_address: ""
consul_advertise_address: "{{ consul_bind_address }}"
consul_client_address: "127.0.0.1 {{ consul_bind_address }}"
consul_retry_join: []

consul_ui: "{{ consul_server }}"
consul_log_level: INFO

consul_bin_dir: /usr/local/bin
consul_user: consul
consul_group: consul
consul_data_dir: /opt/consul
consul_config_dir: /etc/consul.d

consul_gossip_encryption: true
consul_gossip_keys: []

consul_tls: true
consul_tls_dir: "{{ consul_config_dir }}/tls"
consul_pki_dir: ""
consul_pki_ca_days: 3650
consul_pki_cert_days: 825

consul_acl: true
consul_acl_default_policy: deny
consul_acl_token_path: ""

consul_extra_config: {}

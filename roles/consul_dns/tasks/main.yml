---
- name: Validate role inputs
  ansible.builtin.assert:
    that:
      - consul_dns_server is match('^[^:]+:[0-9]+$')
      - consul_dns_domains | length > 0
      - consul_dns_listen_addresses | type_debug == 'list'
      - consul_dns_link is match('^[a-zA-Z0-9_-]{1,15}$')
      - consul_dns_link_address is match('^[0-9.]+/[0-9]+$')
    fail_msg: >-
      consul_dns_server is host:port, consul_dns_domains names at least one
      domain, consul_dns_listen_addresses is a list, consul_dns_link an
      interface name and consul_dns_link_address an address with its prefix.
    quiet: true

- name: Ask whether systemd-resolved is running
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - systemd-resolved
  register: _consul_dns_resolved_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the DNS servers resolved knows per interface
  ansible.builtin.command:
    argv:
      - resolvectl
      - dns
  register: _consul_dns_links
  when: _consul_dns_resolved_active.stdout == 'active'
  changed_when: false
  check_mode: false

- name: Refuse to take over DNS that resolved does not already carry
  ansible.builtin.assert:
    that:
      - _consul_dns_resolved_active.stdout == 'active'
      - _consul_dns_upstream_links | length > 0
    fail_msg: >-
      systemd-resolved has to be running and know the host's upstream DNS
      servers on an interface, as on a stock Ubuntu server, where netplan hands
      them over. Here it does not, and routing the Consul domains through it
      would leave every other name unresolved.
    quiet: true
  vars:
    _consul_dns_upstream_links: >-
      {{ _consul_dns_links.stdout_lines | default([])
         | select('match', '^Link [0-9]+ [(][^)]+[)]: [^ ]')
         | reject('search', consul_dns_server | regex_escape) | list }}

- name: Ensure the resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Serve resolved on the extra addresses
  ansible.builtin.template:
    src: consul.conf.j2
    dest: /etc/systemd/resolved.conf.d/consul.conf
    owner: root
    group: root
    mode: '0644'
  notify: "restart systemd-resolved"

- name: Route the Consul domains to Consul on an interface of their own
  ansible.builtin.template:
    src: consul-dns.service.j2
    dest: /etc/systemd/system/consul-dns.service
    owner: root
    group: root
    mode: '0644'
  register: _consul_dns_unit
  notify: "restart consul-dns"

- name: Ensure the Consul domains are routed at boot and now
  ansible.builtin.systemd_service:
    name: consul-dns
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and _consul_dns_unit is changed)

---
- name: Validate role inputs
  ansible.builtin.assert:
    that:
      - consul_dns_server is match('^[^:]+:[0-9]+$')
      - consul_dns_domains | length > 0
      - consul_dns_listen_addresses | type_debug == 'list'
    fail_msg: >-
      consul_dns_server is host:port, consul_dns_domains names at least one
      domain, and consul_dns_listen_addresses is a list.
    quiet: true

- name: Ask whether systemd-resolved is running
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - systemd-resolved
  register: _consul_dns_resolved_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the DNS servers resolved knows per interface
  ansible.builtin.command:
    argv:
      - resolvectl
      - dns
  register: _consul_dns_links
  when: _consul_dns_resolved_active.stdout == 'active'
  changed_when: false
  check_mode: false

- name: Refuse to take over DNS that resolved does not already carry
  ansible.builtin.assert:
    that:
      - _consul_dns_resolved_active.stdout == 'active'
      - _consul_dns_upstream_links | length > 0
    fail_msg: >-
      systemd-resolved has to be running and know the host's upstream DNS
      servers on an interface, as on a stock Ubuntu server, where netplan hands
      them over. Here it does not, and routing the Consul domains through it
      would leave every other name unresolved.
    quiet: true
  vars:
    _consul_dns_upstream_links: >-
      {{ _consul_dns_links.stdout_lines | default([])
         | select('match', '^Link [0-9]+ [(][^)]+[)]: [^ ]')
         | reject('search', consul_dns_server | regex_escape) | list }}

- name: Ensure the resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Route the Consul domains to Consul
  ansible.builtin.template:
    src: consul.conf.j2
    dest: /etc/systemd/resolved.conf.d/consul.conf
    owner: root
    group: root
    mode: '0644'
  notify: "restart systemd-resolved"

---
- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  listen: "restart systemd-resolved"

- name: Restart consul-dns
  ansible.builtin.systemd_service:
    name: consul-dns
    state: restarted
    daemon_reload: true
  when: not (ansible_check_mode and _consul_dns_unit is changed)
  listen: "restart consul-dns"

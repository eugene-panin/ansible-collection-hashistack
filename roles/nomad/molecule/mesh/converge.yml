---
- name: Converge
  hosts: all
  become: true
  vars:
    _nomad_stack_consul_token: "{{ lookup('ansible.builtin.file', consul_acl_token_path) }}"
  tasks:
    - name: Check whether Consul is installed yet
      ansible.builtin.stat:
        path: /usr/local/bin/consul
      register: _nomad_stack_consul_binary
      check_mode: false

    - name: Run Consul
      ansible.builtin.include_role:
        name: eugene_panin.hashistack.consul

    - name: Ensure the policy Nomad agents register with
      community.general.consul_policy:
        name: nomad-agent
        description: Nomad agents registering themselves and their workloads
        rules: |
          agent_prefix "" {
            policy = "read"
          }
          node_prefix "" {
            policy = "write"
          }
          service_prefix "" {
            policy = "write"
          }
        token: "{{ _nomad_stack_consul_token }}"
        scheme: https
        host: 127.0.0.1
        port: 8501
        ca_path: /etc/consul.d/tls/ca.pem
        state: present
      when: not ansible_check_mode or _nomad_stack_consul_binary.stat.exists
      no_log: true

    - name: Ensure the Nomad agent's Consul token
      community.general.consul_token:
        accessor_id: "{{ 'nomad-agent' | to_uuid }}"
        secret_id: "{{ nomad_consul_token }}"
        description: Nomad agent
        policies:
          - name: nomad-agent
        token: "{{ _nomad_stack_consul_token }}"
        scheme: https
        host: 127.0.0.1
        port: 8501
        ca_path: /etc/consul.d/tls/ca.pem
        state: present
      when: not ansible_check_mode or _nomad_stack_consul_binary.stat.exists
      no_log: true

    - name: Run Docker
      ansible.builtin.include_role:
        name: eugene_panin.base.docker

    - name: Run Nomad
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

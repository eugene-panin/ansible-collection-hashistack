---
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Run Consul
      ansible.builtin.include_role:
        name: eugene_panin.hashistack.consul

    - name: Run Vault
      ansible.builtin.include_role:
        name: eugene_panin.hashistack.vault

    - name: Run Nomad
      ansible.builtin.include_role:
        name: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"

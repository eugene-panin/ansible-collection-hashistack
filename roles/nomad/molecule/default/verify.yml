---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  vars:
    _nomad_test_api: "https://{{ nomad_bind_address }}:4646"
    _nomad_test_ca: /etc/nomad.d/tls/ca.pem
    _nomad_test_token: "{{ lookup('ansible.builtin.file', nomad_acl_token_path) }}"
  tasks:
    - name: Read the rendered agent configuration
      ansible.builtin.slurp:
        src: /etc/nomad.d/nomad.json
      register: _nomad_test_config
      no_log: true

    - name: Assert a node given no Consul or Vault has no block for either
      ansible.builtin.assert:
        that:
          - "'consul' not in _nomad_test_config.content | b64decode | from_json"
          - "'vault' not in _nomad_test_config.content | b64decode | from_json"
        quiet: true

    - name: Ask the running agent which version it is
      ansible.builtin.uri:
        url: "{{ _nomad_test_api }}/v1/agent/self"
        ca_path: "{{ _nomad_test_ca }}"
        headers:
          X-Nomad-Token: "{{ _nomad_test_token }}"
        return_content: true
      register: _nomad_test_self
      no_log: true

    - name: Assert the upgrade restarted the agent onto the new binary
      ansible.builtin.assert:
        that:
          - _nomad_test_self.json.config.Version.Version == '2.0.7'
        quiet: true

    - name: Try the API without a token
      ansible.builtin.uri:
        url: "{{ _nomad_test_api }}/v1/nodes"
        ca_path: "{{ _nomad_test_ca }}"
        status_code: [403]

    - name: Try plain HTTP on the API port
      ansible.builtin.uri:
        url: "http://{{ nomad_bind_address }}:4646/v1/status/leader"
        status_code: [400]

    - name: Read the gossip keyring
      ansible.builtin.uri:
        url: "{{ _nomad_test_api }}/v1/agent/keyring/list"
        ca_path: "{{ _nomad_test_ca }}"
        headers:
          X-Nomad-Token: "{{ _nomad_test_token }}"
        return_content: true
      register: _nomad_test_keyring
      no_log: true

    - name: Assert gossip is encrypted
      ansible.builtin.assert:
        that:
          - _nomad_test_keyring.json.Keys | length == 1
        quiet: true

    - name: Restart the agent, as a reboot would
      ansible.builtin.systemd_service:
        name: nomad
        state: restarted

    - name: Wait for the node to be ready again
      ansible.builtin.uri:
        url: "{{ _nomad_test_api }}/v1/nodes"
        ca_path: "{{ _nomad_test_ca }}"
        headers:
          X-Nomad-Token: "{{ _nomad_test_token }}"
        return_content: true
      register: _nomad_test_nodes
      until: >-
        _nomad_test_nodes.status | default(0) == 200
        and _nomad_test_nodes.json | selectattr('Status', 'equalto', 'ready') | list | length == 1
      retries: 45
      delay: 2
      no_log: true

    - name: Assert one node, this one, ready as a client of this server
      ansible.builtin.assert:
        that:
          - _nomad_test_nodes.json | map(attribute='Name') | list == ['instance-nomad']
        quiet: true

    - name: Read the bridge netfilter setting
      ansible.builtin.command:
        argv:
          - sysctl
          - -n
          - net.bridge.bridge-nf-call-iptables
      register: _nomad_test_brnf
      changed_when: false

    - name: Assert bridged traffic passes through iptables
      ansible.builtin.assert:
        that:
          - _nomad_test_brnf.stdout == '1'
        quiet: true

    - name: List what the role keeps on the controller for the CA
      ansible.builtin.find:
        paths: "{{ nomad_pki_dir }}"
      register: _nomad_test_pki
      delegate_to: localhost
      become: false

    - name: Assert the controller holds the CA and no node key
      ansible.builtin.assert:
        that:
          - _nomad_test_pki.files | map(attribute='path') | map('basename') | sort == ['nomad-ca-key.pem', 'nomad-ca.pem']
        quiet: true

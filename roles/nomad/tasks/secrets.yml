---
- name: Ensure the token directory exists on the controller
  ansible.builtin.file:
    path: "{{ nomad_acl_token_path | dirname }}"
    state: directory
    mode: '0700'
  when: nomad_acl_bootstrap_token | length == 0
  delegate_to: localhost
  become: false
  run_once: true

- name: Mint the bootstrap token once
  ansible.builtin.copy:
    content: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) | to_uuid }}\n"
    dest: "{{ nomad_acl_token_path }}"
    mode: '0600'
    force: false
  when: nomad_acl_bootstrap_token | length == 0
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Check whether the bootstrap token is on the controller
  ansible.builtin.stat:
    path: "{{ nomad_acl_token_path }}"
  register: _nomad_bootstrap_stat
  when: nomad_acl_bootstrap_token | length == 0
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false

- name: Read the bootstrap token
  ansible.builtin.slurp:
    src: "{{ nomad_acl_token_path }}"
  register: _nomad_bootstrap_slurp
  when:
    - nomad_acl_bootstrap_token | length == 0
    - _nomad_bootstrap_stat.stat.exists
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

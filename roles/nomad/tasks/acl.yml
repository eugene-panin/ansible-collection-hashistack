---
- name: Bootstrap the ACL system with the minted token
  ansible.builtin.uri:
    url: "{{ _nomad_api_addr }}/v1/acl/bootstrap"
    method: POST
    ca_path: "{{ _nomad_ca_file }}"
    body_format: json
    body:
      BootstrapSecret: "{{ _nomad_bootstrap_token }}"
    status_code: [200, 400]
    return_content: true
  register: _nomad_acl_bootstrap
  when:
    - _nomad_live | bool
    - _nomad_primary | bool
    - nomad_server | bool
    - _nomad_bootstrap_token | length > 0
  changed_when: _nomad_acl_bootstrap.status == 200
  failed_when: >-
    _nomad_acl_bootstrap.status not in [200, 400]
    or (_nomad_acl_bootstrap.status == 400 and 'already done' not in _nomad_acl_bootstrap.content | default(''))
  no_log: true

- name: Check that the bootstrap token is the cluster's management token
  ansible.builtin.uri:
    url: "{{ _nomad_api_addr }}/v1/acl/token/self"
    ca_path: "{{ _nomad_ca_file }}"
    headers:
      X-Nomad-Token: "{{ _nomad_bootstrap_token }}"
    return_content: true
  register: _nomad_token_self
  when:
    - _nomad_live | bool
    - _nomad_bootstrap_token | length > 0
  failed_when: >-
    _nomad_token_self.status != 200 or _nomad_token_self.json.Type | default('') != 'management'
  check_mode: false
  no_log: true

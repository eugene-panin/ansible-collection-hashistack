---
name: publish

on:
  push:
    tags: ['v*']

jobs:
  galaxy:
    name: galaxy
    runs-on: ubuntu-latest
    environment: galaxy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: python -m pip install --upgrade ansible-core

      - name: Assert the tag matches galaxy.yml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python -c \
            "import yaml,sys; print(yaml.safe_load(open('galaxy.yml'))['version'])")"
          test "$tag" = "$declared" || {
            echo "tag $tag does not match galaxy.yml version $declared" >&2
            exit 1
          }

      - name: Build the collection artifact
        run: ansible-galaxy collection build --output-path dist

      - name: Publish to Galaxy
        run: >-
          ansible-galaxy collection publish dist/*.tar.gz
          --api-key "$GALAXY_API_KEY"
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
